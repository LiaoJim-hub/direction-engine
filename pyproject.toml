[build-system]
# >=77 是 PEP 639（SPDX 许可证表达式 + license-files）的最低要求
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "direction-drift"
version = "2.5.1"
description = "Direction Engine (direction-drift): a direction-drift detection engine for AI agents, a zero-dependency multi-node coexistence layer, and an output-provenance labelling layer for valid inference. It only surfaces, never auto-corrects - alerts belong to the engine, decisions belong to humans."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "NanshanJim", email = "NanshanJim@Outlook.com" }]
keywords = ["ai-agent", "alignment", "drift-detection", "guardrails", "quality-assurance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
# 语义嵌入（生产推荐）：bge-small-zh-v1.5，首次下载约 100MB
sbert = ["sentence-transformers>=2.2.2"]
# 本地 HTTP API 服务
api = ["fastapi>=0.104.0", "uvicorn>=0.24.0"]
# examples/build_cone.py 的 LLM 样本合成交
llm = ["openai>=1.0.0"]
# 开发/CI：pytest 要跑**全套**，含 HTTP 层（v2.3.6）。因此这里必须有
# fastapi（TestClient 需要它）与 httpx（TestClient 的传输层）。
# 不并进来的话，`api/server.py` 在 CI 里只能 importorskip 静默跳过——
# 那正是它 v2.3.6 之前零测试覆盖的老问题。
dev = ["pytest>=7.0", "fastapi>=0.104.0", "uvicorn>=0.24.0", "httpx>=0.24.0"]

[project.urls]
Homepage = "https://github.com/LiaoJim-hub/direction-engine"
Repository = "https://github.com/LiaoJim-hub/direction-engine"
Documentation = "https://github.com/LiaoJim-hub/direction-engine#readme"
Issues = "https://github.com/LiaoJim-hub/direction-engine/issues"
Changelog = "https://github.com/LiaoJim-hub/direction-engine/blob/main/CHANGELOG.md"

[project.scripts]
# `de` —— 四问建卡 / 批量检测 / 出报告。用法与纪律见 docs/cli.md。
# 不安装也可用：python -m direction_drift.cli（或 python -m direction_drift）
de = "direction_drift.cli:main"

[tool.setuptools.packages.find]
include = ["direction_drift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
