name: 新场景卡
description: 提交一张场景卡（本项目最欢迎的贡献）
title: "[card] "
labels: ["card", "contribution"]
body:
  - type: markdown
    attributes:
      value: |
        本项目最高价值的贡献。卡是**数据**——它不改引擎一行代码，就能让引擎认识一个新场景。
        建卡方法见 `examples/README.md`，字段以 `direction_drift/scenario.py` 为准。

        能直接提 PR 更好；只想讨论就用本模板。

  - type: input
    id: card_id
    attributes:
      label: 卡 id
      description: 卡 JSON 里的 `card_id`，建议 `<场景>_v<版本>`
      placeholder: "travel_concierge_v1"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: ①业务方向是什么（`goal` + `core_samples`）
      description: >
        一句话写清这个 Agent 该往哪走，然后贴正例。说清样本来源（人工写 / 真实脱敏 / 合成）
        与条数——**20 条是硬下限**，生产卡建议 30+。请说明你做过的人工抽检通过率。
    validations:
      required: true

  - type: textarea
    id: drift
    attributes:
      label: ②典型跑偏长什么样（`negative_samples`）
      description: >
        反例：真正"走歪"的话，不是"随机无关的话"。**留空会跳过校验但卡等于废的**——标定做不下去。
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: ③哪些话属合法边界（`boundary_samples`）
      description: >
        "合法但不典型"的话。这批样本决定误报率，比正例更值得认真写。
        也可留空（非空时才校验），但强烈建议写。
    validations:
      required: false

  - type: textarea
    id: constraints
    attributes:
      label: ④约束条款（`constraints`）与字面红线（`rule_layer`）
      description: >
        具体禁止动作请用**结构化形态**：{"text": …, "actions": [...], "objects": [...]}。
        自由文本形态靠分词提动词，动作词一旦被标成名词就整批漏判（详见 `examples/README.md`）。
        "提及即违规"类（泄露设定 / 内部机制）归 `rule_layer` 正则，不归 `constraints`。
        另外请设置 `min_suspect_len` 与 `format_whitelist`——合法格式行豁免是组合判据的一部分。
    validations:
      required: true

  - type: textarea
    id: demo
    attributes:
      label: 卡文件与 demo 输出
      description: 贴卡 JSON（或说明在 PR 里的路径），以及 `python examples/demo.py <卡id>` 的输出。
    validations:
      required: true

  - type: checkboxes
    id: hygiene
    attributes:
      label: 提交前自查
      options:
        - label: 卡内不含任何真实个人的可识别信息；真实对话已脱敏（脱敏是提交者的责任）
          required: true
        - label: 我已在本地跑过 `examples/demo.py`：在轨句不被标疑似，出戏句被抓到
          required: true
        - label: 我明白"卡能加载"不等于"卡能用"（条数硬校验发生在 `build_cone()`，`MIN_CORE_SAMPLES=20`）
          required: true
